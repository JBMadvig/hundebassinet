<div #wrapper class="flex h-full w-full overflow-auto overscroll-none shadow-shadow">
  <table class="h-full w-full border-separate border-spacing-0 nb-border">
    <thead
      class="sticky top-0 z-2 w-full bg-secondary-background text-left [&_th]:sticky [&_th]:top-0 [&_th]:border-b-2 [&_th]:border-border [&_th]:pt-2 [&_th]:pr-6 [&_th]:pb-1 [&_th]:pl-2 [&_th]:font-heading [&_th]:text-xl [&_th]:font-bold [&_th]:uppercase [&_th]:first:pl-4 [&_th]:last:pr-4"
    >
      <ng-container *ngTemplateOutlet="headerTemplate()"></ng-container>
    </thead>
    <tbody
      class="[&_td]:border-b-2 [&_td]:border-border [&_td]:py-3 [&_td]:pr-6 [&_td]:pl-2 [&_td]:first:pl-4 [&_td]:last:pr-4 [&_tr]:transition-all [&_tr]:duration-150 [&_tr]:ease-linear [&_tr]:odd:bg-secondary-background [&_tr]:even:bg-background [&_tr:hover]:bg-main [&_tr:hover]:text-main-foreground"
    >
      @for (row of optionsWithTrackBy(); let i = $index; track row.trackByValue) {
        <ng-container *ngTemplateOutlet="rowTemplate(); context: { $implicit: row, index: i }">
        </ng-container>
      } @empty {
        <!-- If no data, and noDataTemplate is provided, show the noDataTemplate -->
        @if (noDataTemplate()) {
          <tr>
            <td colspan="100%">
              <ng-container *ngTemplateOutlet="noDataTemplate()"></ng-container>
            </td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>
