@if (valueFormGroup && valueFormControl) {
  <div
    class="flex flex-col"
    [ngClass]="{
      'flex-col gap-y-1': textPosition() === 'top' || textPosition() === 'bottom',
      'flex-row items-center gap-x-1': textPosition() === 'right' || textPosition() === 'left',
    }"
    [formGroup]="valueFormGroup"
  >
    @if (label()) {
      <label
        class="mb-1 text-xs"
        [ngClass]="{
          'order-last': textPosition() === 'bottom' || textPosition() === 'right',
        }"
        [for]="controlId"
      >
        {{ label() }}
      </label>
    }

    <div class="flex flex-row items-center gap-x-2">
      @if (falseLabel()) {
        <span class="text-xs">{{ falseLabel() }}</span>
      }

      <label class="relative inline-block h-5 w-10 shrink-0">
        <input
          [id]="controlId"
          class="peer h-0 w-0 opacity-0"
          [formControlName]="formControlNameDirective.name"
          type="checkbox"
        />
        <span
          class="nb-border absolute inset-0 cursor-pointer rounded-base bg-secondary-background transition-colors before:absolute before:top-0.5 before:left-0.5 before:h-3 before:w-3 before:rounded-sm before:border-2 before:border-border before:bg-secondary-background before:transition-transform before:content-[''] peer-checked:bg-main peer-checked:before:translate-x-[1.25rem]"
        ></span>
      </label>

      @if (trueLabel()) {
        <span class="text-xs">{{ trueLabel() }}</span>
      }
    </div>
  </div>
}
